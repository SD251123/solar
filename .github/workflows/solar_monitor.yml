name: Solar Monitor Bot

on:
  schedule:
    # 매 시간 0분, 30분마다 정각 기준으로 실행되도록 설정
    - cron: '0,30 * * * *'
  
  workflow_dispatch: # 웹에서 수동으로도 켤 수 있게 유지

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 깃허브 저장소 코드 내려받기
        uses: actions/checkout@v4

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager tqdm

      - name: 🚀 태양광 모니터링 스크립트 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLAR_ID: ${{ secrets.SOLAR_ID }}
          SOLAR_PW: ${{ secrets.SOLAR_PW }}
        run: |
          python solar_monitor.py
